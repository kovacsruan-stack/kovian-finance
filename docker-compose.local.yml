name: kovian-finance-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kovian_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55434:5432"
    volumes:
      - kovian-finance-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kovian_finance"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "56381:6379"
    volumes:
      - kovian-finance-local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/kovian_finance
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      KOVIAN_JWT_SECRET: local-kovian-finance-development-secret-0123456789
      KOVIAN_RATE_LIMIT: 120
      KOVI_INTERNAL_API_KEY: ${KOVIAN_FINANCE_INTERNAL_API_KEY:-local-finance-kovi-internal-key-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  kovian-finance-local-postgres:
  kovian-finance-local-redis:

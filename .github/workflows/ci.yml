name: KOVIAN Finance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovian-finance-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KOVIAN_JWT_SECRET: ci-only-test-secret-at-least-32-characters-long
      KOVI_INTERNAL_API_KEY: ci-only-internal-key-at-least-32-characters
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend and database integration tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build container image
        run: docker build --tag kovian-finance:ci .

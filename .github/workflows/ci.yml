name: KOVIAN Finance CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kovian-finance-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kovian_finance
          POSTGRES_USER: kovian
          POSTGRES_PASSWORD: kovian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kovian -d kovian_finance"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/kovian_finance
      DATABASE_USERNAME: kovian
      DATABASE_PASSWORD: kovian
      REDIS_URL: redis://localhost:6379
      KOVIAN_JWT_SECRET: ci-only-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify

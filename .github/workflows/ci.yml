name: KOVIAN Finance CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kovian_finance
          POSTGRES_USER: kovian
          POSTGRES_PASSWORD: kovian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kovian -d kovian_finance"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/kovian_finance
      DATABASE_USERNAME: kovian
      DATABASE_PASSWORD: kovian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

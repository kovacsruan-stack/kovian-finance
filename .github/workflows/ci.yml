name: KOVIAN Finance CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kovian-finance-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kovian_finance
          POSTGRES_USER: kovian
          POSTGRES_PASSWORD: kovian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kovian -d kovian_finance"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/kovian_finance
      DATABASE_USERNAME: kovian
      DATABASE_PASSWORD: kovian
      REDIS_URL: redis://localhost:6379
      KOVIAN_JWT_SECRET: ci-only-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -vE '(^|/)\.env\.example$' || true)"
          test -z "$bad" || { echo "Tracked environment files detected:"; echo "$bad"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Flyway versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates="$(find src/main/resources/db/migration -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -nE 's/^(V[^_]+)__.*/\1/p' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate Flyway migration versions:"; echo "$duplicates"; exit 1; }
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Dependency review
        run: ./mvnw -B -ntp dependency:tree -DoutputType=text -Dverbose=false
      - name: Verify backend
        run: ./mvnw -B -ntp clean verify
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test -- --run
          npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-finance-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-finance-${{ runner.os }}-
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: OWASP Dependency-Check
        run: ./mvnw -B -ntp -Psecurity-scan verify
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finance-dependency-check
          path: target/dependency-check/
          if-no-files-found: warn

  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Capture backend diagnostics
        shell: bash
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/kovian_finance
          DATABASE_USERNAME: kovian
          DATABASE_PASSWORD: kovian
          REDIS_URL: redis://localhost:6379
          KOVIAN_JWT_SECRET: ci-only-test-secret-at-least-32-characters-long
        run: |
          set +e
          chmod +x mvnw
          ./mvnw -B -ntp clean verify > finance-maven-diagnostics.log 2>&1
          echo "MVN_EXIT=$?" >> finance-maven-diagnostics.log
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finance-maven-diagnostics
          path: finance-maven-diagnostics.log
          if-no-files-found: warn

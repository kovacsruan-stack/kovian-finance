name: Finance PWA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PWA assets
        run: |
          test -f src/main/resources/static/app/index.html
          test -f src/main/resources/static/app/manifest.webmanifest
          test -f src/main/resources/static/app/sw.js
          test -f src/main/resources/static/app/icon.svg
          grep -q '"display":"standalone"' src/main/resources/static/app/manifest.webmanifest
      - name: Build
        run: ./mvnw -q -DskipTests package

name: Finance PWA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kovian-finance-pwa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint frontend
        run: npm run lint
      - name: Type check frontend
        run: npx tsc --noEmit
      - name: Test frontend
        run: npm test -- --run
      - name: Build frontend
        run: npm run build
      - name: Verify PWA assets
        run: |
          set -euo pipefail
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/kovian-finance-icon.svg
          grep -Eq '"display"[[:space:]]*:[[:space:]]*"standalone"' public/manifest.webmanifest

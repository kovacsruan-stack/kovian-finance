name: Finance PWA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        run: npm install --package-lock=false
      - name: Build frontend
        run: npm run build
      - name: Verify PWA assets
        run: |
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/kovian-finance-icon.svg
          grep -q '"display":"standalone"' public/manifest.webmanifest

name: Finance PWA

# PWA-specific checks remain available manually; main CI handles standard validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - name: Verify PWA assets
        run: |
          set -euo pipefail
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/kovian-finance-icon.svg
          grep -Eq '"display"[[:space:]]*:[[:space:]]*"standalone"' public/manifest.webmanifest

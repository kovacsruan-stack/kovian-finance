spring:
  application:
    name: kovian-finance
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kovian_finance}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

spring:
  application:
    name: kovian-finance
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/kovian_finance}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: ${PORT:${SERVER_PORT:8082}}
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,application/javascript,text/html,text/plain,text/css,image/svg+xml
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
kovian:
  accelerators:
    lago:
      enabled: ${KOVIAN_LAGO_ENABLED:false}
      base-url: ${KOVIAN_LAGO_BASE_URL:}
      usage-path: ${KOVIAN_LAGO_USAGE_PATH:/api/v1/events}
      api-key: ${KOVIAN_LAGO_API_KEY:}
    killbill:
      enabled: ${KOVIAN_KILLBILL_ENABLED:false}
      base-url: ${KOVIAN_KILLBILL_BASE_URL:}
      subscription-path: ${KOVIAN_KILLBILL_SUBSCRIPTION_PATH:/1.0/kb/accounts}
      api-key: ${KOVIAN_KILLBILL_API_KEY:}
  notifications:
    rules-interval-ms: ${KOVIAN_NOTIFICATION_RULES_INTERVAL_MS:60000}
  kovi:
    internal-api-key: ${KOVI_INTERNAL_API_KEY:}
  outbox:
    transport: ${KOVIAN_OUTBOX_TRANSPORT:log}
    http:
      endpoint: ${KOVIAN_OUTBOX_HTTP_ENDPOINT:}
      api-key: ${KOVIAN_OUTBOX_HTTP_API_KEY:}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

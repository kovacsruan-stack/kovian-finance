spring:
  application:
    name: kovian-finance
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kovian_finance}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  error:
    include-message: never
    include-stacktrace: never
kovian:
  notifications:
    rules-interval-ms: ${KOVIAN_NOTIFICATION_RULES_INTERVAL_MS:60000}
  kovi:
    internal-api-key: ${KOVI_INTERNAL_API_KEY:}

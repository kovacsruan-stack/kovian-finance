<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="KOVIAN Finance"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/app/manifest.webmanifest"><link rel="icon" href="/app/icon.svg"><title>KOVIAN Finance</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font:16px system-ui,-apple-system,sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#111827;border:1px solid #243044;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0006}h1{margin:0 0 8px;font-size:30px}p{color:#94a3b8;line-height:1.5}.grid{display:grid;gap:12px;margin-top:24px}.tile{padding:16px;border-radius:16px;background:#172033;border:1px solid #26344d}.status{font-weight:700}.ok{color:#34d399}.wait{color:#fbbf24}button{border:0;border-radius:12px;padding:12px 16px;background:#f8fafc;color:#0b1220;font-weight:700;cursor:pointer}</style></head><body><main><section class="card"><h1>KOVIAN Finance</h1><p>Aplicativo móvel do domínio Finance. Esta versão valida a instalação PWA e a conectividade com a API.</p><div class="grid"><div class="tile">API <span id="api" class="status wait">verificando…</span></div><div class="tile">PWA <span class="status ok">pronto para instalação</span></div><button id="install" hidden>Instalar aplicativo</button></div></section></main><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/app/sw.js",{scope:"/app/"});fetch("/actuator/health").then(r=>r.ok?document.querySelector("#api").textContent="online":Promise.reject()).catch(()=>document.querySelector("#api").textContent="indisponível");let d;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();d=e;document.querySelector("#install").hidden=false});document.querySelector("#install").onclick=async()=>{if(!d)return;d.prompt();await d.userChoice;d=null};</script></body></html>
